services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: pgpassword
      POSTGRES_DB: taskflow
    volumes:
      - taskflow_prod_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U taskflow -d taskflow",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - taskflow_prod_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LISTEN_ADDR: 0.0.0.0:3001
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SYSTEM_CONFIG_SECRET: ${SYSTEM_CONFIG_SECRET}

      DATABASE_URL: postgresql://taskflow:pgpassword@postgres:5432/taskflow
      REDIS_URL: redis://redis:6379

      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_USE_SSL: ${S3_USE_SSL}
      S3_REGION: ${S3_REGION}
      S3_PATH_STYLE: ${S3_PATH_STYLE}

      CORS_ORIGINS: ${CORS_ORIGINS}

      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED}
      CAP_ENABLED: ${CAP_ENABLED}
      CAP_URL: ${CAP_URL}
      CAP_SECRET: ${CAP_SECRET}

      LOG_LEVEL: ${LOG_LEVEL}
      AXIOM_TOKEN: ${AXIOM_TOKEN}
      AXIOM_DATASET: ${AXIOM_DATASET}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS}
      LOG_PRISMA_PARAMS: ${LOG_PRISMA_PARAMS}

      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_CAP_API_ENDPOINT: ${NEXT_PUBLIC_CAP_API_ENDPOINT}
        API_INTERNAL_URL: http://api:3001
        INSTRUMENTATION_SNIPPET: ${INSTRUMENTATION_SNIPPET}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  taskflow_prod_pg_data:
  taskflow_prod_redis_data: