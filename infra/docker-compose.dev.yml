services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: taskflow
      MINIO_ROOT_PASSWORD: taskflow123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  cap:
    image: tiago2/cap:latest
    restart: unless-stopped
    environment:
      ADMIN_KEY: taskflow-dev-admin
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3002:3000"
    volumes:
      - cap_data:/usr/src/app/.data

volumes:
  pg_data:
  minio_data:
  cap_data:
