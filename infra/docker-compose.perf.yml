services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-5GB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - taskflow_perf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-768mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - taskflow_perf_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_BIND_ADDR:-0.0.0.0}:${S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND_ADDR:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - taskflow_perf_minio_data:/data
    networks:
      default:
        aliases:
          - ${S3_ENDPOINT}

  migrate:
    image: taskflow-api:perf
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskflow}
    command:
      - sh
      - -lc
      - cd /app/packages/db && ./node_modules/.bin/prisma migrate deploy

  api:
    image: taskflow-api:perf
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      LISTEN_ADDR: 0.0.0.0:3001
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SYSTEM_CONFIG_SECRET: ${SYSTEM_CONFIG_SECRET}

      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskflow}
      REDIS_URL: redis://redis:6379

      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PORT: ${S3_PORT:-9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_REGION: ${S3_REGION:-auto}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}

      CORS_ORIGINS: ${CORS_ORIGINS}

      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-true}
      CAP_ENABLED: ${CAP_ENABLED:-false}
      CAP_URL: ${CAP_URL:-}
      CAP_SECRET: ${CAP_SECRET:-}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-200}
      LOG_PRISMA_PARAMS: ${LOG_PRISMA_PARAMS:-false}

      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${API_BIND_ADDR:-0.0.0.0}:${API_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: taskflow-web:perf
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_CAP_API_ENDPOINT: ${NEXT_PUBLIC_CAP_API_ENDPOINT:-}
        INSTRUMENTATION_SCRIPT_URLS: ${INSTRUMENTATION_SCRIPT_URLS:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:3001
    ports:
      - "${WEB_BIND_ADDR:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  seed-users-classes:
    image: taskflow-api:perf
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles: ["seed"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskflow}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SEED_BASE_URL: ${SEED_BASE_URL:-http://api:3001}
      SEED_ORIGIN: ${SEED_ORIGIN:-}
      SEED_COUNT: ${SEED_COUNT:-100}
      SEED_CONCURRENCY: ${SEED_CONCURRENCY:-10}
      SEED_EMAIL_DOMAIN: ${SEED_EMAIL_DOMAIN:-example.com}
      SEED_PASSWORD: ${SEED_PASSWORD:-12345678}
      SEED_NICKNAME_PREFIX: ${SEED_NICKNAME_PREFIX:-Random User}
      SEED_CLASS_PREFIX: ${SEED_CLASS_PREFIX:-Random Class}
      SEED_CLASS_DESCRIPTION: ${SEED_CLASS_DESCRIPTION:-Created for performance testing}
      SEED_OUTPUT_FILE: ${SEED_OUTPUT_FILE:-}
      SEED_TIMEZONE: ${SEED_TIMEZONE:-Asia/Shanghai}
    volumes:
      - ../perf:/app/perf:ro
      - ../perf/results:/app/perf/results
    command:
      - node
      - /app/perf/scripts/seed-users-classes.mjs

volumes:
  taskflow_perf_pg_data:
  taskflow_perf_redis_data:
  taskflow_perf_minio_data:
