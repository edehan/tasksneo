version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    target-branch: dev
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    target-branch: dev
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    target-branch: dev
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    labels:
      - dependencies
