openapi: 3.0.0

info:
  title: TaskFlow API
  version: 1.0.0
  description: |
    TaskFlow 后端 REST API。
    
    ## 鉴权说明
    
    - 普通用户接口：在请求头中携带 `Authorization: Bearer <JWT>`
    - 管理员控制平面接口（`/admin/*`）：在请求头中携带 `Authorization: Bearer <ADMIN_TOKEN>`
    - 两套鉴权体系完全独立
    
    ## 错误格式
    
    所有错误响应统一格式：
    ```json
    { "error": "错误描述", "code": "ERROR_CODE" }
    ```
    
    ## 时间格式
    
    所有时间字段均为 ISO 8601 格式，UTC 时区，例如 `2025-06-01T12:00:00.000Z`。

servers:
  - url: http://localhost:3001
    description: 本地开发环境
  - url: https://api.taskflow.example.com
    description: 生产环境

# ─── Security Schemes ────────────────────────────────────────────────────────

components:
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 用户 JWT Token，通过 /auth/login 获取
    adminAuth:
      type: http
      scheme: bearer
      description: 管理员 ADMIN_TOKEN，通过环境变量配置

  # ─── Reusable Schemas ──────────────────────────────────────────────────────

  schemas:

    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: 人类可读的错误描述
        code:
          type: string
          description: 机器可读的错误代码
      example:
        error: "资源不存在"
        code: "NOT_FOUND"

    # ── Auth ──

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        nickname:
          type: string
        schoolId:
          type: string
          format: uuid
          nullable: true
        studentId:
          type: string
          nullable: true
          description: 若 schoolId 不为空则必填
        timezone:
          type: string
          description: IANA 时区标识符（如 Asia/Shanghai），由浏览器上报，未提供时默认 UTC
          example: Asia/Shanghai

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT Token，有效期 7 天
        user:
          $ref: '#/components/schemas/UserProfile'

    # ── Users ──

    UserProfile:
      type: object
      required: [id, email, timezone, isActive, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
          nullable: true
        schoolId:
          type: string
          format: uuid
          nullable: true
        schoolName:
          type: string
          nullable: true
          description: 冗余字段，方便前端展示，无需再查学校表
        studentId:
          type: string
          nullable: true
        timezone:
          type: string
          description: IANA 时区标识符
          example: Asia/Shanghai
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          nullable: true
        schoolId:
          type: string
          format: uuid
          nullable: true
        studentId:
          type: string
          nullable: true
        timezone:
          type: string
          description: IANA 时区标识符（如 Asia/Shanghai）
          example: America/New_York

    UpdatePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    NotificationPref:
      type: object
      required: [id, channel, address, isEnabled]
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [EMAIL, WEBHOOK, TELEGRAM]
        address:
          type: string
        isEnabled:
          type: boolean

    UpsertNotificationPrefRequest:
      type: object
      required: [channel, address]
      properties:
        channel:
          type: string
          enum: [EMAIL, WEBHOOK, TELEGRAM]
        address:
          type: string
        isEnabled:
          type: boolean
          default: true

    # ── Schools ──

    School:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    # ── Classes ──

    ClassSummary:
      type: object
      required: [id, name, color, isPersonal, ownerId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
          description: Hex 颜色值，如 #6366f1
        isPersonal:
          type: boolean
        ownerId:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
          nullable: true
        inviteCode:
          type: string
          nullable: true
          description: 仅 OWNER 和 ADMIN 可见
        myRole:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
          description: 当前请求用户在此班级中的角色
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateClassRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
          default: "#6366f1"
        schoolId:
          type: string
          format: uuid
          nullable: true

    UpdateClassRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string

    ClassMember:
      type: object
      required: [userId, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        nickname:
          type: string
          nullable: true
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
        joinedAt:
          type: string
          format: date-time

    TransferOwnershipRequest:
      type: object
      required: [newOwnerId]
      properties:
        newOwnerId:
          type: string
          format: uuid

    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [ADMIN, MEMBER]
          description: 只能设为 ADMIN 或 MEMBER，不能直接设为 OWNER

    # ── Tasks ──

    TaskSummary:
      type: object
      required: [id, classId, title, createdAt]
      properties:
        id:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        className:
          type: string
        title:
          type: string
        startAt:
          type: string
          format: date-time
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        allowLateSubmission:
          type: boolean
        blockedBy:
          type: array
          items:
            type: string
            format: uuid
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userState:
          $ref: '#/components/schemas/TaskUserState'
          description: 当前用户对此任务的状态，可能为 null（未产生任何互动时）
          nullable: true

    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          properties:
            description:
              type: string
              nullable: true
              description: Markdown 正文
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/AttachmentMeta'
            stats:
              $ref: '#/components/schemas/TaskStats'
              description: 仅 OWNER 和 ADMIN 可见
              nullable: true

    TaskStats:
      type: object
      description: 任务的已读/已提交统计，仅管理员可见
      properties:
        memberCount:
          type: integer
        viewedCount:
          type: integer
        submittedCount:
          type: integer

    TaskUserState:
      type: object
      properties:
        viewedAt:
          type: string
          format: date-time
          nullable: true
        tags:
          type: array
          items:
            type: string
        sortOrder:
          type: number

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        startAt:
          type: string
          format: date-time
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        allowLateSubmission:
          type: boolean
          default: true
        blockedBy:
          type: array
          items:
            type: string
            format: uuid
          default: []

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        startAt:
          type: string
          format: date-time
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        allowLateSubmission:
          type: boolean
        blockedBy:
          type: array
          items:
            type: string
            format: uuid

    UpdateTaskStateRequest:
      type: object
      description: 用户更新自己对某任务的个人状态（tags、排序）
      properties:
        tags:
          type: array
          items:
            type: string
        sortOrder:
          type: number

    ParseTaskRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: 用户输入的自然语言任务描述

    ParseTaskResponse:
      type: object
      description: LLM 解析结果，字段不确定时为 null，前端负责展示并让用户确认
      properties:
        title:
          type: string
          nullable: true
        startAt:
          type: string
          format: date-time
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        description:
          type: string
          nullable: true

    # ── Submissions ──

    SubmissionSummary:
      type: object
      required: [id, taskId, userId, firstSubmittedAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userNickname:
          type: string
          nullable: true
        userEmail:
          type: string
        firstSubmittedAt:
          type: string
          format: date-time
        lastUpdatedAt:
          type: string
          format: date-time
        score:
          type: number
          nullable: true
        reviewerId:
          type: string
          format: uuid
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        reviewNote:
          type: string
          nullable: true

    SubmissionDetail:
      allOf:
        - $ref: '#/components/schemas/SubmissionSummary'
        - type: object
          properties:
            content:
              type: string
              nullable: true
              description: Markdown 正文
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/AttachmentMeta'

    UpsertSubmissionRequest:
      type: object
      properties:
        content:
          type: string
          nullable: true
          description: Markdown 正文

    GradeSubmissionRequest:
      type: object
      properties:
        score:
          type: number
          nullable: true
        reviewNote:
          type: string
          nullable: true

    # ── Attachments ──

    AttachmentMeta:
      type: object
      required: [id, fileKey, originalName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fileKey:
          type: string
        originalName:
          type: string
        renamedFile:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
        url:
          type: string
          description: 文件访问地址，指向 GET /files/:fileKey
        createdAt:
          type: string
          format: date-time

    # ── Admin ──

    AdminUserSummary:
      type: object
      required: [id, email, timezone, isActive, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        nickname:
          type: string
          nullable: true
        schoolName:
          type: string
          nullable: true
        studentId:
          type: string
          nullable: true
        timezone:
          type: string
          description: IANA 时区标识符
          example: Asia/Shanghai
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AdminUpdateUserRequest:
      type: object
      properties:
        nickname:
          type: string
          nullable: true
        isActive:
          type: boolean
        newPassword:
          type: string
          nullable: true
          minLength: 8

    SystemConfigMap:
      type: object
      description: system_config 表的完整键值对，敏感字段值被遮蔽（显示为 ***）
      additionalProperties:
        type: string
      example:
        "app.title": "TaskFlow"
        "app.base_url": "https://taskflow.example.com"
        "auth.registration_open": "true"
        "smtp.host": "smtp.example.com"
        "smtp.password": "***"
        "llm.api_key": "***"

    UpdateSystemConfigRequest:
      type: object
      description: 传入需要更新的键值对，未传入的键不受影响
      additionalProperties:
        type: string

    AdminTestEmailRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          format: email

    CreateSchoolRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    # ── Pagination ──

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean

# ─── Paths ───────────────────────────────────────────────────────────────────

paths:

  # ══════════════════════════════════════════════════════
  # AUTH
  # ══════════════════════════════════════════════════════

  /auth/register:
    post:
      tags: [Auth]
      summary: 用户注册
      description: |
        创建新用户账号。
        
        - 注册成功后自动创建个人空间（isPersonal = true 的班级）。
        - 若 `auth.registration_open` 为 false，返回 403。
        - 若 schoolId 不为空，studentId 为必填项。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功，返回 Token 和用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: 请求参数不合法（如 schoolId 有值但 studentId 为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 注册功能已关闭
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 邮箱已被注册，或该学校下学号已被使用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 邮箱或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 账号已被停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════
  # USERS (当前登录用户操作自己的数据)
  # ══════════════════════════════════════════════════════

  /users/me:
    get:
      tags: [Users]
      summary: 获取当前用户信息
      security:
        - userAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: 成功
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [Users]
      summary: 更新当前用户基本信息
      description: |
        更新昵称、学校、学号。
        若更新学号，需满足同一学校内唯一的约束。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: 参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 学号冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/password:
    patch:
      tags: [Users]
      summary: 修改当前用户密码
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '204':
          description: 修改成功，无返回体
        '400':
          description: 原密码错误或新密码不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/notification-prefs:
    get:
      tags: [Users]
      summary: 获取当前用户的通知偏好设置
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPref'

    put:
      tags: [Users]
      summary: 创建或更新某渠道的通知偏好
      description: 若该渠道的记录已存在则更新，否则创建（upsert）。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertNotificationPrefRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPref'

  /users/me/delete:
    post:
      tags: [Users]
      summary: 删除当前用户账号
      description: |
        删除用户自己的账号及全部数据。
        
        前置条件：用户不能是任何非私有班级的 OWNER。
        若不满足，返回 400 并说明需要处理的班级。
        
        删除序列：
        1. 删除所有提交及提交附件（MinIO + DB）
        2. 删除个人空间（级联删除其中的任务和附件）
        3. 删除用户行（级联删除凭据、通知配置、成员记录等）
      security:
        - userAuth: []
      responses:
        '204':
          description: 删除成功
        '400':
          description: 用户仍是某些班级的所有者，需先转让或解散
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      ownedClasses:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string

  # ══════════════════════════════════════════════════════
  # SCHOOLS (公开接口，无需登录)
  # ══════════════════════════════════════════════════════

  /schools:
    get:
      tags: [Schools]
      summary: 获取学校列表
      description: 用于注册页面的下拉选项，无需登录。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/School'

  # ══════════════════════════════════════════════════════
  # CLASSES
  # ══════════════════════════════════════════════════════

  /classes:
    get:
      tags: [Classes]
      summary: 获取当前用户加入的所有班级
      description: 包含个人空间和所有共享班级。
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassSummary'

    post:
      tags: [Classes]
      summary: 创建共享班级
      description: |
        创建成功后，当前用户自动成为 OWNER。
        系统自动生成邀请码。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSummary'

  /classes/join:
    post:
      tags: [Classes]
      summary: 通过邀请码加入班级
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode:
                  type: string
      responses:
        '200':
          description: 加入成功，返回班级信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSummary'
        '403':
          description: 班级限制特定学校，当前用户学校不符
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 邀请码无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 已是该班级成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /classes/{classId}:
    parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Classes]
      summary: 获取班级详情
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSummary'
        '403':
          description: 无权限（非成员）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 班级不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [Classes]
      summary: 更新班级信息
      description: 仅 OWNER 和 ADMIN 可操作。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClassRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSummary'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Classes]
      summary: 删除班级
      description: |
        仅 OWNER 可操作。个人空间不可删除。
        
        删除后级联清理：成员记录、任务（含附件、task_user_state）、通知队列。
        成员的提交记录不删除。
      security:
        - userAuth: []
      responses:
        '204':
          description: 删除成功
        '403':
          description: 权限不足，或尝试删除个人空间
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /classes/{classId}/invite-code:
    parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Classes]
      summary: 刷新邀请码
      description: 生成新邀请码，旧邀请码立即失效。仅 OWNER 和 ADMIN 可操作。
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功，返回新邀请码
          content:
            application/json:
              schema:
                type: object
                properties:
                  inviteCode:
                    type: string
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /classes/{classId}/transfer:
    parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Classes]
      summary: 转让班级所有权
      description: |
        仅 OWNER 可操作。
        
        执行后：新 OWNER 的成员角色设为 OWNER，原 OWNER 降为 ADMIN。
        操作在单个事务中完成。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '200':
          description: 转让成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSummary'
        '400':
          description: 目标用户不是班级成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /classes/{classId}/members:
    parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Classes]
      summary: 获取班级成员列表
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassMember'
        '403':
          description: 非班级成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /classes/{classId}/members/{userId}:
    parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      tags: [Classes]
      summary: 修改成员角色
      description: |
        仅 OWNER 可将成员设为 ADMIN 或将 ADMIN 降为 MEMBER。
        ADMIN 无此权限。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassMember'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Classes]
      summary: 移除班级成员
      description: |
        OWNER 和 ADMIN 可移除 MEMBER。
        OWNER 可移除 ADMIN。
        不能移除 OWNER（需先转让所有权）。
        成员也可用此接口移除自己（退出班级），但 OWNER 不能移除自己。
      security:
        - userAuth: []
      responses:
        '204':
          description: 成功
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════
  # TASKS
  # ══════════════════════════════════════════════════════

  /classes/{classId}/tasks:
    parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Tasks]
      summary: 获取班级任务列表
      description: |
        返回该班级所有有效任务（deletedAt IS NULL）。
        每条任务附带当前用户的 userState（未产生互动时为 null）。
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskSummary'
        '403':
          description: 非班级成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Tasks]
      summary: 在班级中创建任务
      description: 仅 OWNER 和 ADMIN 可操作。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/parse:
    post:
      tags: [Tasks]
      summary: 用 AI 解析自然语言为任务字段
      description: |
        将用户输入的自然语言文本发送给 LLM，返回结构化字段建议。
        
        此接口**不创建任务**，仅做解析。
        
        LLM 返回不确定的字段时，对应值为 null。
        若 LLM 调用失败或返回格式异常，接口仍返回 200，所有字段均为 null（降级处理，不报错）。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseTaskRequest'
      responses:
        '200':
          description: 解析结果（部分或全部字段可能为 null）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseTaskResponse'

  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Tasks]
      summary: 获取任务详情
      description: |
        返回任务完整信息，包含正文和附件。
        
        管理员额外可见 stats（已读/已提交统计）。
        
        **此接口不自动记录已读**，已读由单独的 POST /tasks/:taskId/view 触发。
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '403':
          description: 无权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 任务不存在或已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [Tasks]
      summary: 更新任务信息
      description: 仅 OWNER 和 ADMIN 可操作。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Tasks]
      summary: 删除任务
      description: |
        仅 OWNER 和 ADMIN 可操作。
        
        - 若任务有零条提交：硬删除，完整清理所有关联数据和 MinIO 文件。
        - 若任务有提交记录：软删除，清空正文和附件，保留任务行供提交引用。
      security:
        - userAuth: []
      responses:
        '204':
          description: 删除成功
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{taskId}/view:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Tasks]
      summary: 记录任务已读
      description: |
        成员打开任务详情时，前端调用此接口记录首次查看时间。
        
        - 若已有 viewedAt 记录，则不做任何操作（首次查看语义，不覆盖）。
        - 若记录不存在则创建，写入 viewedAt = now()。
        - 此接口对前端而言是 fire-and-forget，失败不影响用户阅读任务。
      security:
        - userAuth: []
      responses:
        '204':
          description: 成功（无返回体）

  /tasks/{taskId}/state:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Tasks]
      summary: 更新当前用户对任务的个人状态
      description: 更新 tags 和 sortOrder。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskStateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskUserState'

  # ══════════════════════════════════════════════════════
  # SUBMISSIONS
  # ══════════════════════════════════════════════════════

  /tasks/{taskId}/submissions:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Submissions]
      summary: 获取任务的提交列表（管理员视图）
      description: |
        仅 OWNER 和 ADMIN 可访问。
        
        返回班级所有成员的提交情况，**包括未提交的成员**。
        查询从 class_members 出发做 LEFT JOIN submissions，保证名单完整。
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubmissionSummary'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{taskId}/submissions/me:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Submissions]
      summary: 获取当前用户对此任务的提交
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        '404':
          description: 当前用户尚未提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Submissions]
      summary: 创建或更新当前用户的提交
      description: |
        Upsert 语义：若提交记录不存在则创建，已存在则更新。
        
        - 创建时写入 firstSubmittedAt，后续更新不修改此字段。
        - 更新时 lastUpdatedAt 自动刷新。
        - 附件通过单独的附件上传接口处理，此接口只接受 Markdown 正文。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertSubmissionRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        '403':
          description: 提交已被锁定（allowLateSubmission = false 且已过期）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{taskId}/submissions/{submissionId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: submissionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Submissions]
      summary: 获取单条提交详情（含附件）
      description: |
        仅 OWNER 和 ADMIN 可访问，用于评分页查看单个提交的正文与附件。
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 提交不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{taskId}/submissions/{submissionId}/grade:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: submissionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Submissions]
      summary: 对提交评分
      description: |
        仅 OWNER 和 ADMIN 可操作。
        自动将 reviewerId 设为当前用户，reviewedAt 设为当前时间。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeSubmissionRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{taskId}/submissions/export:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Submissions]
      summary: 导出成绩 CSV
      description: |
        仅 OWNER 和 ADMIN 可操作。
        
        包含所有班级成员，未提交的成员提交相关字段为空。
        
        CSV 列：昵称、学校、学号、班级、任务名称、首次提交时间、最后修改时间、成绩
      security:
        - userAuth: []
      responses:
        '200':
          description: CSV 文件
          content:
            text/csv:
              schema:
                type: string
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename="submissions_export.csv"'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════
  # ATTACHMENTS
  # ══════════════════════════════════════════════════════

  /tasks/{taskId}/attachments:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Attachments]
      summary: 上传任务附件（任务正文用）
      description: 仅 OWNER 和 ADMIN 可操作。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentMeta'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{taskId}/submissions/me/attachments:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Attachments]
      summary: 上传提交附件
      description: |
        为当前用户的提交上传附件。
        若提交记录尚未创建，上传时自动创建。
        旧附件在上传新附件后由服务端删除（MinIO + DB）。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentMeta'

  /users/me/avatar:
    post:
      tags: [Attachments]
      summary: 上传用户头像
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentMeta'

  /files/{fileKey}:
    parameters:
      - name: fileKey
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Attachments]
      summary: 访问文件
      description: |
        后端验证权限后，重定向到 MinIO 预签名 URL（短效，TTL 5 分钟）。
        客户端不会获得长效凭证。
      security:
        - userAuth: []
      responses:
        '302':
          description: 重定向到预签名 URL
          headers:
            Location:
              schema:
                type: string
        '403':
          description: 无权访问此文件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 文件不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{taskId}/submissions/rename:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Attachments]
      summary: 批量重命名提交附件
      description: |
        仅 OWNER 和 ADMIN 可操作。
        
        按模板 `{班级名}_{昵称}_{学号}_{原文件名}` 更新每条提交附件的 renamedFile 字段。
        MinIO 对象键不变，只更新展示名。
      security:
        - userAuth: []
      responses:
        '204':
          description: 成功

  # ══════════════════════════════════════════════════════
  # ADMIN
  # ══════════════════════════════════════════════════════

  /admin/config:
    get:
      tags: [Admin]
      summary: 获取全局系统配置
      description: 敏感字段值显示为 ***。
      security:
        - adminAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfigMap'
        '401':
          description: ADMIN_TOKEN 无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [Admin]
      summary: 更新系统配置
      description: 只更新传入的键，未传入的键不受影响。
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSystemConfigRequest'
      responses:
        '200':
          description: 更新成功，返回完整配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfigMap'

  /admin/config/test-email:
    post:
      tags: [Admin]
      summary: 发送 SMTP 测试邮件
      description: 使用当前系统配置中的 SMTP 参数向指定地址发送测试邮件。
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTestEmailRequest'
      responses:
        '204':
          description: 发送成功
        '400':
          description: SMTP 配置不完整或参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users:
    get:
      tags: [Admin]
      summary: 获取用户列表
      security:
        - adminAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: q
          in: query
          description: 按邮箱或昵称搜索
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUserSummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      tags: [Admin]
      summary: 修改用户信息 / 停用 / 重置密码
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSummary'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Admin]
      summary: 删除用户
      description: |
        跳过"必须先处理班级"的前置检查，直接执行删除序列。
        该用户拥有的非私有班级不会被自动处理，需管理员另行操作。
      security:
        - adminAuth: []
      responses:
        '204':
          description: 删除成功
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/schools:
    get:
      tags: [Admin]
      summary: 获取学校列表（管理员视图）
      security:
        - adminAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/School'

    post:
      tags: [Admin]
      summary: 添加学校
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchoolRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
        '409':
          description: 学校名称已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/schools/{schoolId}:
    parameters:
      - name: schoolId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Admin]
      summary: 删除学校
      description: 关联用户和班级的 schoolId 自动置空（FK SET NULL）。
      security:
        - adminAuth: []
      responses:
        '204':
          description: 删除成功
        '404':
          description: 学校不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# ─── Tags ─────────────────────────────────────────────────────────────────────

tags:
  - name: Auth
    description: 注册、登录
  - name: Users
    description: 当前用户的个人信息与设置
  - name: Schools
    description: 学校列表（公开）
  - name: Classes
    description: 班级管理
  - name: Tasks
    description: 任务管理与 AI 解析
  - name: Submissions
    description: 任务提交、评分与导出
  - name: Attachments
    description: 文件上传与访问
  - name: Admin
    description: 管理员控制平面（需要 ADMIN_TOKEN）
