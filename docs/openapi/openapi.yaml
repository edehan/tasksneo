openapi: 3.0.0

info:
  title: TaskFlow API
  version: 1.0.0
  description: |
    TaskFlow 后端 REST API。
    
    ## 鉴权说明
    
    - 普通用户接口：在请求头中携带 `Authorization: Bearer <JWT>`
    - 管理员控制平面接口（`/admin/*`）：在请求头中携带 `Authorization: Bearer <ADMIN_TOKEN>`
    - 两套鉴权体系完全独立
    
    ## 错误格式
    
    所有错误响应统一格式：
    ```json
    { "error": "错误描述", "code": "ERROR_CODE" }
    ```
    
    ## 时间格式
    
    所有时间字段均为 ISO 8601 格式，UTC 时区，例如 `2025-06-01T12:00:00.000Z`。

servers:
  - url: http://localhost:3001
    description: 本地开发环境
  - url: https://api.taskflow.example.com
    description: 生产环境

# ─── Security Schemes ────────────────────────────────────────────────────────

components:
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 用户 JWT Token，通过 /auth/login 获取
    adminAuth:
      type: http
      scheme: bearer
      description: 管理员 ADMIN_TOKEN，通过环境变量配置

  # ─── Reusable Schemas ──────────────────────────────────────────────────────

  schemas:

    Comment:
      type: object
      required: [id, content, createdAt, author, replyTo]
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        author:
          nullable: true
          type: object
          properties:
            id:
              type: string
              format: uuid
            nickname:
              type: string
              nullable: true
            avatarHash:
              type: string
              nullable: true
          required: [id, nickname, avatarHash]
        replyTo:
          nullable: true
          type: object
          properties:
            id:
              type: string
              format: uuid
            nickname:
              type: string
              nullable: true
          required: [id, nickname]

    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: 人类可读的错误描述
        code:
          type: string
          description: 机器可读的错误代码
      example:
        error: "资源不存在"
        code: "NOT_FOUND"

    # ── Auth ──

    RegisterRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
      description: Step 1 — sends a verification email to the address.

    RegisterCompleteRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: Token from verification email link
        password:
          type: string
          minLength: 8
        nickname:
          type: string
        schoolId:
          type: string
          format: uuid
          nullable: true
        studentId:
          type: string
          nullable: true
          description: Required when schoolId is provided
        timezone:
          type: string
          description: IANA timezone identifier (e.g. Asia/Shanghai), defaults to UTC
          example: Asia/Shanghai

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    ChangeEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ConfirmEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT Token，有效期 7 天
        user:
          $ref: '#/components/schemas/UserProfile'

    # ── Users ──

    UserProfile:
      type: object
      required: [id, email, timezone, isActive, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
          nullable: true
        schoolId:
          type: string
          format: uuid
          nullable: true
        schoolName:
          type: string
          nullable: true
          description: 冗余字段，方便前端展示，无需再查学校表
        studentId:
          type: string
          nullable: true
        timezone:
          type: string
          description: IANA 时区标识符
          example: Asia/Shanghai
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          nullable: true
        schoolId:
          type: string
          format: uuid
          nullable: true
        studentId:
          type: string
          nullable: true
        timezone:
          type: string
          description: IANA 时区标识符（如 Asia/Shanghai）
          example: America/New_York

    UpdatePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    NotificationPref:
      type: object
      required: [id, channel, address, isEnabled]
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [EMAIL, WEBHOOK, TELEGRAM]
        address:
          type: string
        isEnabled:
          type: boolean

    NotificationItem:
      type: object
      required: [id, type, taskTitle, className, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [TASK_PUBLISHED, TASK_DUE_REMINDER]
        taskId:
          type: string
          format: uuid
          nullable: true
        classId:
          type: string
          format: uuid
          nullable: true
        taskTitle:
          type: string
        className:
          type: string
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    UpsertNotificationPrefRequest:
      type: object
      required: [channel, address]
      properties:
        channel:
          type: string
          enum: [EMAIL, WEBHOOK, TELEGRAM]
        address:
          type: string
        isEnabled:
          type: boolean
          default: true

    # ── Schools ──

    School:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    # ── Classes ──

    ClassSummary:
      type: object
      required: [id, name, color, isPersonal, ownerId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
          description: Hex 颜色值，如 #6366f1
        isPersonal:
          type: boolean
        ownerId:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
          nullable: true
        inviteCode:
          type: string
          nullable: true
          description: 仅 OWNER 和 ADMIN 可见
        myRole:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
          description: 当前请求用户在此班级中的角色
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateClassRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
          default: "#6366f1"
        schoolId:
          type: string
          format: uuid
          nullable: true

    UpdateClassRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string

    ClassMember:
      type: object
      required: [userId, avatarHash, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        nickname:
          type: string
          nullable: true
        avatarHash:
          type: string
          description: SHA-256 hex hash of user email for gravatar lookup
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
        joinedAt:
          type: string
          format: date-time

    TransferOwnershipRequest:
      type: object
      required: [newOwnerId]
      properties:
        newOwnerId:
          type: string
          format: uuid

    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [ADMIN, MEMBER]
          description: 只能设为 ADMIN 或 MEMBER，不能直接设为 OWNER

    # ── Tasks ──

    TaskSummary:
      type: object
      required: [id, classId, title, createdAt]
      properties:
        id:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        className:
          type: string
        title:
          type: string
        startAt:
          type: string
          format: date-time
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        allowLateSubmission:
          type: boolean
        blockedBy:
          type: array
          items:
            type: string
            format: uuid
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userState:
          $ref: '#/components/schemas/TaskUserState'
          description: 当前用户对此任务的状态，可能为 null（未产生任何互动时）
          nullable: true
        submittedCount:
          type: integer
          description: 该任务的已提交人数（所有成员可见）
        memberCount:
          type: integer
          description: 该任务所属班级的成员总数（所有成员可见）

    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          properties:
            description:
              type: string
              nullable: true
              description: Markdown 正文
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/AttachmentMeta'
            stats:
              $ref: '#/components/schemas/TaskStats'
              description: 仅 OWNER 和 ADMIN 可见
              nullable: true

    TaskStats:
      type: object
      description: 任务的已读/已提交统计，仅管理员可见
      properties:
        memberCount:
          type: integer
        viewedCount:
          type: integer
        submittedCount:
          type: integer

    TaskUserState:
      type: object
      properties:
        viewedAt:
          type: string
          format: date-time
          nullable: true
        tags:
          type: array
          items:
            type: string
        sortOrder:
          type: number

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        startAt:
          type: string
          format: date-time
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        allowLateSubmission:
          type: boolean
          default: true
        blockedBy:
          type: array
          items:
            type: string
            format: uuid
          default: []

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        startAt:
          type: string
          format: date-time
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        allowLateSubmission:
          type: boolean
        blockedBy:
          type: array
          items:
            type: string
            format: uuid

    UpdateTaskStateRequest:
      type: object
      description: 用户更新自己对某任务的个人状态（tags、排序）
      properties:
        tags:
          type: array
          items:
            type: string
        sortOrder:
          type: number

    ParseTaskRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: 用户输入的自然语言任务描述

    ParseTimeOption:
      type: object
      properties:
        startAt:
          type: string
          format: date-time
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true

    ParseTaskResponse:
      type: object
      description: LLM 解析结果。timeOptions 包含 1–3 个可能的时间解释，当 AI 对用户输入的时间表达不确定时返回多个选项，前端展示让用户选择。
      properties:
        title:
          type: string
          nullable: true
        timeOptions:
          type: array
          items:
            $ref: '#/components/schemas/ParseTimeOption'
          minItems: 1
          maxItems: 3
          description: 1–3 个可能的起止时间选项。优先返回 1 个，仅在用户输入有歧义时返回多个。
        allowLateSubmission:
          type: boolean
          nullable: true
          description: 仅当用户明确提及时返回 true/false，否则 null
        description:
          type: string
          nullable: true

    ParseDraftTaskResponse:
      allOf:
        - $ref: '#/components/schemas/ParseTaskResponse'
        - type: object
          properties:
            markdownCached:
              type: boolean
              description: 是否已生成并缓存 markdown 正文草稿

    # ── Submissions ──

    SubmissionListRow:
      type: object
      description: 班级成员提交情况行（管理员视图）
      required: [userId, avatarHash, role, submitted, attachments]
      properties:
        userId:
          type: string
          format: uuid
        nickname:
          type: string
          nullable: true
        avatarHash:
          type: string
          description: SHA-256 hex hash of user email for gravatar lookup
        schoolName:
          type: string
          nullable: true
        studentId:
          type: string
          nullable: true
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
        submitted:
          type: boolean
        submission:
          $ref: '#/components/schemas/SubmissionSummary'
          nullable: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentMeta'
          description: 该提交的附件列表（未提交者为空数组）

    SubmissionSummary:
      type: object
      required: [id, taskId, userId, firstSubmittedAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userNickname:
          type: string
          nullable: true
        userEmail:
          type: string
        firstSubmittedAt:
          type: string
          format: date-time
        lastUpdatedAt:
          type: string
          format: date-time
        score:
          type: number
          nullable: true
        reviewerId:
          type: string
          format: uuid
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        reviewNote:
          type: string
          nullable: true
        isExemplary:
          type: boolean
          description: 是否为模范作业

    SubmissionDetail:
      allOf:
        - $ref: '#/components/schemas/SubmissionSummary'
        - type: object
          properties:
            content:
              type: string
              nullable: true
              description: Markdown 正文
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/AttachmentMeta'

    UpsertSubmissionRequest:
      type: object
      properties:
        content:
          type: string
          nullable: true
          description: Markdown 正文

    GradeSubmissionRequest:
      type: object
      properties:
        score:
          type: number
          nullable: true
        reviewNote:
          type: string
          nullable: true

    # ── Attachments ──

    AttachmentMeta:
      type: object
      required: [id, fileKey, originalName, isVisible, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fileKey:
          type: string
        originalName:
          type: string
        renamedFile:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
        isVisible:
          type: boolean
          description: 仅对任务附件生效；false 时成员列表隐藏但仍可通过正文内链访问
        url:
          type: string
          description: 文件访问地址，指向 GET /files/:fileKey
        createdAt:
          type: string
          format: date-time

    # ── Admin ──

    AdminUserSummary:
      type: object
      required: [id, email, timezone, isActive, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        nickname:
          type: string
          nullable: true
        schoolName:
          type: string
          nullable: true
        studentId:
          type: string
          nullable: true
        timezone:
          type: string
          description: IANA 时区标识符
          example: Asia/Shanghai
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AdminUpdateUserRequest:
      type: object
      properties:
        nickname:
          type: string
          nullable: true
        isActive:
          type: boolean
        newPassword:
          type: string
          nullable: true
          minLength: 8

    SystemConfigMap:
      type: object
      description: system_config 表的完整键值对，敏感字段值被遮蔽（显示为 ***）
      additionalProperties:
        type: string
      example:
        "app.title": "TaskFlow"
        "app.base_url": "https://taskflow.example.com"
        "auth.registration_open": "true"
        "smtp.host": "smtp.example.com"
        "smtp.password": "***"
        "llm.api_key": "***"

    UpdateSystemConfigRequest:
      type: object
      description: 传入需要更新的键值对，未传入的键不受影响
      additionalProperties:
        type: string

    AdminTestEmailRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          format: email

    CreateSchoolRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    SiteAnnouncement:
      type: object
      required:
        - id
        - title
        - content
        - status
        - scheduledAt
        - publishedAt
        - cancelledAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [SCHEDULED, PUBLISHED, CANCELLED]
        scheduledAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ── Pagination ──

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean

# ─── Paths ───────────────────────────────────────────────────────────────────

paths:

  # ══════════════════════════════════════════════════════
  # AUTH
  # ══════════════════════════════════════════════════════

  /auth/register:
    post:
      tags: [Auth]
      summary: Send registration verification email
      description: |
        Step 1 of registration. Sends a verification email to the provided address.
        The email contains a link with a token to complete registration.

        - Rate limited to 5 emails per address per 24 hours.
        - If `auth.registration_open` is false, returns 403.
        - If email is already registered, returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Registration is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register/complete:
    post:
      tags: [Auth]
      summary: Complete registration after email verification
      description: |
        Step 2 of registration. Accepts the token from the verification email
        along with account details. Creates the user and returns a JWT.

        - Token is single-use and expires after 1 hour.
        - Automatically creates a personal class for the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCompleteRequest'
      responses:
        '201':
          description: Registration complete, returns JWT and user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid or expired token, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 邮箱或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account is deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset email
      description: |
        Sends a password reset email if the address is registered.
        Always returns 200 to prevent email enumeration.
        Rate limited to 5 emails per address per 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: If the email exists, a reset link has been sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      description: |
        Validates the reset token and sets a new password.
        Returns a JWT so the user is logged in immediately.
        Token is single-use and expires after 1 hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful, returns JWT and user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify-token:
    get:
      tags: [Auth]
      summary: Verify a token is valid
      description: |
        Checks whether a verification token is still valid and returns the
        associated email. Used by frontend pages before showing forms.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: purpose
          in: query
          required: true
          schema:
            type: string
            enum: [REGISTRATION, PASSWORD_RESET]
      responses:
        '200':
          description: Token verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  email:
                    type: string

  # ══════════════════════════════════════════════════════
  # USERS
  # ══════════════════════════════════════════════════════

  /users/me:
    get:
      tags: [Users]
      summary: 获取当前用户信息
      security:
        - userAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: 成功
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [Users]
      summary: 更新当前用户基本信息
      description: |
        更新昵称、学校、学号。
        若更新学号，需满足同一学校内唯一的约束。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: 参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 学号冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/password:
    patch:
      tags: [Users]
      summary: 修改当前用户密码
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '204':
          description: 修改成功，无返回体
        '400':
          description: Invalid current password or new password too short
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/email/change:
    post:
      tags: [Users]
      summary: Request email change verification
      description: |
        Sends a verification email to the new address. The user's email
        will not change until they click the verification link.
        Rate limited to 5 emails per address per 24 hours.
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/email/confirm:
    post:
      tags: [Users]
      summary: Confirm email change
      description: |
        Validates the email change token and updates the user's email address.
        Token is single-use and expires after 1 hour.
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailRequest'
      responses:
        '200':
          description: Email updated, returns updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/notification-prefs:
    get:
      tags: [Users]
      summary: 获取当前用户的通知偏好设置
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPref'

    put:
      tags: [Users]
      summary: 创建或更新某渠道的通知偏好
      description: 若该渠道的记录已存在则更新，否则创建（upsert）。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertNotificationPrefRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPref'

  /users/me/notifications:
    get:
      tags: [Users]
      summary: 获取当前用户的通知收件箱
      description: 分页返回通知历史，按创建时间倒序排列。仅返回已发送（SENT）的通知。
      security:
        - userAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
          description: 上一页最后一条通知的 ID
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationItem'
                  nextCursor:
                    type: string
                    nullable: true
                  unreadCount:
                    type: integer

  /users/me/notifications/unread-count:
    get:
      tags: [Users]
      summary: 获取未读通知数量
      description: 轻量级接口，仅返回未读数量，用于通知铃铛徽章。
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount:
                    type: integer

  /users/me/notifications/{id}/read:
    patch:
      tags: [Users]
      summary: 标记单条通知为已读
      security:
        - userAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        '404':
          description: 通知不存在或不属于当前用户

  /users/me/notifications/read-all:
    post:
      tags: [Users]
      summary: 标记所有通知为已读
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer

  /users/me/delete:
    post:
      tags: [Users]
      summary: 删除当前用户账号
      description: |
        删除用户自己的账号及全部数据。
        
        前置条件：用户不能是任何非私有班级的 OWNER。
        若不满足，返回 400 并说明需要处理的班级。
        
        删除序列：
        1. 删除所有提交及提交附件（MinIO + DB）
        2. 删除个人空间（级联删除其中的任务和附件）
        3. 删除用户行（级联删除凭据、通知配置、成员记录等）
      security:
        - userAuth: []
      responses:
        '204':
          description: 删除成功
        '400':
          description: 用户仍是某些班级的所有者，需先转让或解散
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      ownedClasses:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string

  # ══════════════════════════════════════════════════════
  # SCHOOLS (公开接口，无需登录)
  # ══════════════════════════════════════════════════════

  /schools:
    get:
      tags: [Schools]
      summary: 获取学校列表
      description: 用于注册页面的下拉选项，无需登录。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/School'

  # ══════════════════════════════════════════════════════
  # CLASSES
  # ══════════════════════════════════════════════════════

  /classes:
    get:
      tags: [Classes]
      summary: 获取当前用户加入的所有班级
      description: 包含个人空间和所有共享班级。
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassSummary'

    post:
      tags: [Classes]
      summary: 创建共享班级
      description: |
        创建成功后，当前用户自动成为 OWNER。
        系统自动生成邀请码。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSummary'

  /classes/join:
    post:
      tags: [Classes]
      summary: 通过邀请码加入班级
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode:
                  type: string
      responses:
        '200':
          description: 加入成功，返回班级信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSummary'
        '403':
          description: 班级限制特定学校，当前用户学校不符
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 邀请码无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 已是该班级成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /classes/{classId}:
    parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Classes]
      summary: 获取班级详情
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSummary'
        '403':
          description: 无权限（非成员）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 班级不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [Classes]
      summary: 更新班级信息
      description: 仅 OWNER 和 ADMIN 可操作。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClassRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSummary'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Classes]
      summary: 删除班级
      description: |
        仅 OWNER 可操作。个人空间不可删除。
        
        删除后级联清理：成员记录、任务（含附件、task_user_state）、通知队列。
        成员的提交记录不删除。
      security:
        - userAuth: []
      responses:
        '204':
          description: 删除成功
        '403':
          description: 权限不足，或尝试删除个人空间
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /classes/{classId}/invite-code:
    parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Classes]
      summary: 刷新邀请码
      description: 生成新邀请码，旧邀请码立即失效。仅 OWNER 和 ADMIN 可操作。
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功，返回新邀请码
          content:
            application/json:
              schema:
                type: object
                properties:
                  inviteCode:
                    type: string
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /classes/{classId}/transfer:
    parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Classes]
      summary: 转让班级所有权
      description: |
        仅 OWNER 可操作。
        
        执行后：新 OWNER 的成员角色设为 OWNER，原 OWNER 降为 ADMIN。
        操作在单个事务中完成。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '200':
          description: 转让成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSummary'
        '400':
          description: 目标用户不是班级成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /classes/{classId}/members:
    parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Classes]
      summary: 获取班级成员列表
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassMember'
        '403':
          description: 非班级成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /classes/{classId}/members/{userId}:
    parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      tags: [Classes]
      summary: 修改成员角色
      description: |
        仅 OWNER 可将成员设为 ADMIN 或将 ADMIN 降为 MEMBER。
        ADMIN 无此权限。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassMember'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Classes]
      summary: 移除班级成员
      description: |
        OWNER 和 ADMIN 可移除 MEMBER。
        OWNER 可移除 ADMIN。
        不能移除 OWNER（需先转让所有权）。
        成员也可用此接口移除自己（退出班级），但 OWNER 不能移除自己。
      security:
        - userAuth: []
      responses:
        '204':
          description: 成功
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════
  # TASKS
  # ══════════════════════════════════════════════════════

  /classes/{classId}/tasks:
    parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Tasks]
      summary: 获取班级任务列表
      description: |
        返回该班级所有有效任务（deletedAt IS NULL）。
        每条任务附带当前用户的 userState（未产生互动时为 null）。
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskSummary'
        '403':
          description: 非班级成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Tasks]
      summary: 在班级中创建任务
      description: 仅 OWNER 和 ADMIN 可操作。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /classes/{classId}/tasks/drafts/mine:
    parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tasks]
      summary: 获取当前用户在该班级的最新草稿任务
      description: |
        返回当前用户在指定班级中最近创建的未发布草稿任务（含附件列表）。
        如果没有草稿则 draft 为 null。仅 OWNER/ADMIN 可调用。
      security:
        - userAuth: []
      responses:
        '200':
          description: 草稿任务（可能为 null）
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft:
                    allOf:
                      - $ref: '#/components/schemas/TaskSummary'
                      - type: object
                        properties:
                          attachments:
                            type: array
                            items:
                              $ref: '#/components/schemas/AttachmentMeta'
                    nullable: true

  /tasks/parse:
    post:
      tags: [Tasks]
      summary: 用 AI 解析自然语言为任务字段
      description: |
        将用户输入的自然语言文本发送给 LLM，返回结构化字段建议。
        
        此接口**不创建任务**，仅做解析。
        
        LLM 返回不确定的字段时，对应值为 null。
        若 LLM 调用失败或返回格式异常，接口仍返回 200，所有字段均为 null（降级处理，不报错）。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseTaskRequest'
      responses:
        '200':
          description: 解析结果（部分或全部字段可能为 null）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseTaskResponse'

  /tasks/{taskId}/parse:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Tasks]
      summary: AI 解析草稿任务（含附件）
      description: |
        对已有草稿任务调用 LLM 解析。会读取任务已上传的附件一并发送给 AI。
        解析结果自动更新草稿的 title、startAt、dueAt、description 字段（使用第一个 timeOption）。
        同时生成 markdown 正文缓存（通过 GET /tasks/{taskId}/draft-markdown 读取）。
        仅 OWNER/ADMIN 可调用。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: 用户输入的自然语言任务描述（可选，不传则使用任务已有的 sourceText）
      responses:
        '200':
          description: 解析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseDraftTaskResponse'

  /tasks/{taskId}/transcribe:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Tasks]
      summary: 语音转文字（Speech-to-Text）
      description: |
        上传音频文件，通过 AssemblyAI Universal-2 模型转录为文本。
        音频即用即抛，不存储。仅 OWNER/ADMIN 可调用。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: 音频文件（webm、mp3 等格式）
      responses:
        '200':
          description: 转录结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
                    description: 转录文本
                  language:
                    type: string
                    nullable: true
                    description: 检测到的语言代码

  /tasks/{taskId}/revise:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Tasks]
      summary: AI 修改任务正文
      description: |
        将当前正文和修改指令发送给 LLM，返回修改后的 markdown 内容。
        仅 OWNER/ADMIN 可调用。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentContent, instruction]
              properties:
                currentContent:
                  type: string
                  description: 当前任务正文 markdown
                instruction:
                  type: string
                  description: 修改指令（通常来自语音转录）
      responses:
        '200':
          description: 修改后的内容
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisedContent:
                    type: string
                    description: 修改后的 markdown 内容

  /tasks/{taskId}/draft-markdown:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tasks]
      summary: 读取草稿任务的 AI 生成 markdown 缓存
      description: |
        返回 AI 解析时生成的 markdown 正文草稿（缓存在 Redis，TTL 3 天）。
        仅 OWNER/ADMIN 可调用。
      security:
        - userAuth: []
      responses:
        '200':
          description: markdown 缓存内容
          content:
            application/json:
              schema:
                type: object
                properties:
                  markdown:
                    type: string
                    nullable: true

  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Tasks]
      summary: 获取任务详情
      description: |
        返回任务完整信息，包含正文和附件。
        
        管理员额外可见 stats（已读/已提交统计）。
        
        **此接口不自动记录已读**，已读由单独的 POST /tasks/:taskId/view 触发。
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '403':
          description: 无权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 任务不存在或已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [Tasks]
      summary: 更新任务信息
      description: 仅 OWNER 和 ADMIN 可操作。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Tasks]
      summary: 删除任务
      description: |
        仅 OWNER 和 ADMIN 可操作。
        
        - 若任务有零条提交：硬删除，完整清理所有关联数据和 MinIO 文件。
        - 若任务有提交记录：软删除，清空正文和附件，保留任务行供提交引用。
      security:
        - userAuth: []
      responses:
        '204':
          description: 删除成功
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{taskId}/view:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Tasks]
      summary: 记录任务已读
      description: |
        成员打开任务详情时，前端调用此接口记录首次查看时间。
        
        - 若已有 viewedAt 记录，则不做任何操作（首次查看语义，不覆盖）。
        - 若记录不存在则创建，写入 viewedAt = now()。
        - 此接口对前端而言是 fire-and-forget，失败不影响用户阅读任务。
      security:
        - userAuth: []
      responses:
        '204':
          description: 成功（无返回体）

  /tasks/{taskId}/state:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Tasks]
      summary: 更新当前用户对任务的个人状态
      description: 更新 tags 和 sortOrder。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskStateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskUserState'

  # ══════════════════════════════════════════════════════
  # SUBMISSIONS
  # ══════════════════════════════════════════════════════

  /tasks/{taskId}/submissions:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Submissions]
      summary: 获取任务的提交列表（管理员视图）
      description: |
        仅 OWNER 和 ADMIN 可访问。
        
        返回班级所有成员的提交情况，**包括未提交的成员**。
        查询从 class_members 出发做 LEFT JOIN submissions，保证名单完整。
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubmissionListRow'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{taskId}/submissions/me:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Submissions]
      summary: 获取当前用户对此任务的提交
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        '404':
          description: 当前用户尚未提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Submissions]
      summary: 创建或更新当前用户的提交
      description: |
        Upsert 语义：若提交记录不存在则创建，已存在则更新。
        
        - 创建时写入 firstSubmittedAt，后续更新不修改此字段。
        - 更新时 lastUpdatedAt 自动刷新。
        - 附件通过单独的附件上传接口处理，此接口只接受 Markdown 正文。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertSubmissionRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        '403':
          description: 提交已被锁定（allowLateSubmission = false 且已过期）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{taskId}/submissions/{submissionId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: submissionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Submissions]
      summary: 获取单条提交详情（含附件）
      description: |
        仅 OWNER 和 ADMIN 可访问，用于评分页查看单个提交的正文与附件。
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 提交不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{taskId}/submissions/{submissionId}/grade:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: submissionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Submissions]
      summary: 对提交评分
      description: |
        仅 OWNER 和 ADMIN 可操作。
        自动将 reviewerId 设为当前用户，reviewedAt 设为当前时间。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeSubmissionRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{taskId}/submissions/{submissionId}/exemplary:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: submissionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Submissions]
      summary: 切换模范作业标记
      description: |
        仅 OWNER 和 ADMIN 可操作。Toggle 模式：已标记则取消，未标记则设置。
        标记为模范作业时要求：
        - 提交必须已评分（score 非 null）
        - 评语（reviewNote）不少于 30 个字符
      security:
        - userAuth: []
      responses:
        '200':
          description: 成功，返回更新后的提交详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        '400':
          description: 不满足模范作业条件（未评分或评语不足 30 字符）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{taskId}/submissions/export:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Submissions]
      summary: 导出成绩 CSV
      description: |
        仅 OWNER 和 ADMIN 可操作。
        
        包含所有班级成员，未提交的成员提交相关字段为空。
        
        CSV 列：昵称、学校、学号、班级、任务名称、首次提交时间、最后修改时间、成绩
      security:
        - userAuth: []
      responses:
        '200':
          description: CSV 文件
          content:
            text/csv:
              schema:
                type: string
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename="submissions_export.csv"'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════
  # ATTACHMENTS
  # ══════════════════════════════════════════════════════

  /tasks/{taskId}/attachments:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Attachments]
      summary: 上传任务附件（任务正文用）
      description: 仅 OWNER 和 ADMIN 可操作。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                isVisible:
                  type: boolean
                  description: 可选，任务附件是否在成员侧展示（默认 true）
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentMeta'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{taskId}/submissions/me/attachments:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Attachments]
      summary: 上传提交附件
      description: |
        为当前用户的提交上传附件。
        若提交记录尚未创建，上传时自动创建。
        旧附件在上传新附件后由服务端删除（MinIO + DB）。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentMeta'

  /users/me/avatar:
    post:
      tags: [Attachments]
      summary: 上传用户头像
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentMeta'

  /files/{fileKey}:
    parameters:
      - name: fileKey
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Attachments]
      summary: 访问文件
      description: |
        后端验证权限后，重定向到 S3 预签名 URL（短效，TTL 5 分钟）。
        客户端不会获得长效凭证。适用于编程式下载（如 ZIP 打包）。
        若只需获取 URL（如 `<img src>`），推荐使用 `/files/{fileKey}/url`。
      security:
        - userAuth: []
      responses:
        '302':
          description: 重定向到预签名 URL
          headers:
            Location:
              schema:
                type: string
        '403':
          description: 无权访问此文件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 文件不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /files/{fileKey}/url:
    parameters:
      - name: fileKey
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Attachments]
      summary: 获取文件预签名 URL
      description: |
        验证权限后，返回 S3 预签名 URL（JSON 格式，TTL 5 分钟）。
        前端可直接用于 `<img src>` 等场景，无需通过 API 中转文件内容。
      security:
        - userAuth: []
      responses:
        '200':
          description: 预签名 URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: S3 预签名 URL
                  expiresIn:
                    type: integer
                    description: URL 有效期（秒）
                    example: 300
                required:
                  - url
                  - expiresIn
        '403':
          description: 无权访问此文件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 文件不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /files/attachments/{attachmentId}:
    parameters:
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Attachments]
      summary: 更新任务附件显示状态
      description: |
        仅支持任务附件，且仅 OWNER/ADMIN 可操作。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isVisible]
              properties:
                isVisible:
                  type: boolean
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentMeta'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 附件不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Attachments]
      summary: 删除附件
      security:
        - userAuth: []
      responses:
        '204':
          description: 删除成功

  /tasks/{taskId}/submissions/rename:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Attachments]
      summary: 批量重命名提交附件
      description: |
        仅 OWNER 和 ADMIN 可操作。
        
        按模板 `{班级名}_{昵称}_{学号}_{原文件名}` 更新每条提交附件的 renamedFile 字段。
        MinIO 对象键不变，只更新展示名。
      security:
        - userAuth: []
      responses:
        '204':
          description: 成功

  # ── Comments ──────────────────────────────────────────

  /tasks/{taskId}/comments:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tasks]
      summary: 获取任务评论列表
      description: |
        返回指定任务的所有评论，按时间正序排列。
        需要拥有该任务所在班级的成员权限。
      security:
        - userAuth: []
      responses:
        '200':
          description: 评论列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                required:
                  - comments
        '403':
          description: 无权访问此任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Tasks]
      summary: 发表评论
      description: |
        在指定任务下发表纯文本评论。
        需要班级成员权限，且任务必须已发布。
        评论会触发邮件通知：直接评论通知班级管理员，回复通知被回复的用户。
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: 评论内容（纯文本）
                replyToId:
                  type: string
                  format: uuid
                  nullable: true
                  description: 被回复用户的 ID（可选）
              required:
                - content
      responses:
        '201':
          description: 评论创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: 任务未发布或内容无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════
  # ADMIN
  # ══════════════════════════════════════════════════════

  /admin/config:
    get:
      tags: [Admin]
      summary: 获取全局系统配置
      description: 敏感字段值显示为 ***。
      security:
        - adminAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfigMap'
        '401':
          description: ADMIN_TOKEN 无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [Admin]
      summary: 更新系统配置
      description: 只更新传入的键，未传入的键不受影响。
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSystemConfigRequest'
      responses:
        '200':
          description: 更新成功，返回完整配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfigMap'

  /admin/config/test-email:
    post:
      tags: [Admin]
      summary: 发送 SMTP 测试邮件
      description: 使用当前系统配置中的 SMTP 参数向指定地址发送测试邮件。
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTestEmailRequest'
      responses:
        '204':
          description: 发送成功
        '400':
          description: SMTP 配置不完整或参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users:
    get:
      tags: [Admin]
      summary: 获取用户列表
      security:
        - adminAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: q
          in: query
          description: 按邮箱或昵称搜索
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUserSummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      tags: [Admin]
      summary: 修改用户信息 / 停用 / 重置密码
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSummary'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Admin]
      summary: 删除用户
      description: |
        跳过"必须先处理班级"的前置检查，直接执行删除序列。
        该用户拥有的非私有班级不会被自动处理，需管理员另行操作。
      security:
        - adminAuth: []
      responses:
        '204':
          description: 删除成功
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/schools:
    get:
      tags: [Admin]
      summary: 获取学校列表（管理员视图）
      security:
        - adminAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/School'

    post:
      tags: [Admin]
      summary: 添加学校
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchoolRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
        '409':
          description: 学校名称已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/storage-status:
    get:
      tags: [Admin]
      summary: 获取 S3 存储状态
      description: |
        返回当前 S3 存储后端的连接信息和健康状态。
        用于管理面板展示存储配置和连通性。
      security:
        - adminAuth: []
      responses:
        '200':
          description: 存储状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint:
                    type: string
                    example: "<account-id>.r2.cloudflarestorage.com"
                  bucket:
                    type: string
                    example: "taskflow-files"
                  useSSL:
                    type: boolean
                  region:
                    type: string
                    example: "auto"
                  connected:
                    type: boolean
                  error:
                    type: string
                    description: 连接失败时的错误信息
                required:
                  - endpoint
                  - bucket
                  - useSSL
                  - region
                  - connected

  /admin/schools/{schoolId}:
    parameters:
      - name: schoolId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Admin]
      summary: 删除学校
      description: 关联用户和班级的 schoolId 自动置空（FK SET NULL）。
      security:
        - adminAuth: []
      responses:
        '204':
          description: 删除成功
        '404':
          description: 学校不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/announcements:
    get:
      tags: [Admin]
      summary: 列出站点公告
      description: 返回最近 50 条站点公告（含 SCHEDULED / PUBLISHED / CANCELLED）。
      security:
        - adminAuth: []
      responses:
        '200':
          description: 公告列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteAnnouncement'
    post:
      tags: [Admin]
      summary: 创建站点公告
      description: |
        创建站点公告并向所有活跃用户扇出通知。
        - `publishMode: "immediate"` 立即发布并同步扇出通知（不走延迟队列）。
        - `publishMode: "delayed"`（默认）计划 10 分钟后发布，在此期间可取消。
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                content:
                  type: string
                  minLength: 1
                  maxLength: 5000
                publishMode:
                  type: string
                  enum: [immediate, delayed]
                  default: delayed
                  description: immediate 立即发布；delayed 延迟 10 分钟发布（可取消）。
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAnnouncement'

  /admin/announcements/{announcementId}/cancel:
    parameters:
      - name: announcementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Admin]
      summary: 取消已计划的公告
      description: 仅能取消 SCHEDULED 状态的公告；已发布或已取消的公告保持原状。
      security:
        - adminAuth: []
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAnnouncement'
        '404':
          description: 公告不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# ─── Tags ─────────────────────────────────────────────────────────────────────

tags:
  - name: Auth
    description: 注册、登录
  - name: Users
    description: 当前用户的个人信息与设置
  - name: Schools
    description: 学校列表（公开）
  - name: Classes
    description: 班级管理
  - name: Tasks
    description: 任务管理与 AI 解析
  - name: Submissions
    description: 任务提交、评分与导出
  - name: Attachments
    description: 文件上传与访问
  - name: Admin
    description: 管理员控制平面（需要 ADMIN_TOKEN）
